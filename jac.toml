[project]
name = "rem"
version = "0.1.0"
description = "REM — long-term-care shift-handoff memory on a consolidating belief graph"
# Merge note: A had entry-point = "main.sv.jac", kind = "service" (headless).
# PRD §10.2 locks the full-stack path ("everything in Jac, served by
# jac start main.jac") and the rubric scores single-file full-stack, so the
# merged project stays web-app. A's main.sv.jac is kept as a server module and
# imported from main.jac rather than being the entry point.
entry-point = "main.jac"
kind = "web-app"

[dependencies]
byllm = "~=0.6"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
d3-force = "^3.0.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

# Model routing (PRD §10.4). DeepSeek in the PRD; we route to whatever key exists
# in this environment. Flat structs + enum classification -> cheap model; the nested
# SBARPlus composition -> the stronger model. Validated at hour 2 (see compose.jac).
[byllm.model]
default_model = "gpt-4o-mini"

[byllm.call_params]
temperature = 0.2

[serve]
base_route_app = "app"

[client]

[test]
verbose = true
