# Render deploy for the REM telephony bridge.
#
# Root Directory must be set to `bridge` in the Render dashboard (or deploy this
# file from the repo root with rootDir below).
#
# After the first deploy, set PUBLIC_URL to the service's own https URL --
# SignalWire fetches the TwiML from it and opens the media websocket against it,
# so the bridge has to know its own public hostname.

services:
  - type: web
    name: rem-bridge
    runtime: node
    plan: free
    rootDir: bridge
    buildCommand: npm install
    startCommand: node server.mjs
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: SIGNALWIRE_SPACE_URL
        sync: false
      - key: SIGNALWIRE_PROJECT_ID
        sync: false
      - key: SIGNALWIRE_TOKEN
        sync: false
      - key: SIGNALWIRE_PHONE_NUMBER
        sync: false
      # Set to this service's own https URL once Render assigns it,
      # e.g. https://rem-bridge.onrender.com
      - key: PUBLIC_URL
        sync: false
